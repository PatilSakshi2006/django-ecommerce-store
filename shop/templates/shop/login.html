{% extends 'shop/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}<div class="auth-wrap"><form method="post" class="form-card auth-card">{% csrf_token %}<p class="eyebrow">WELCOME BACK</p><h1>Login</h1><p class="muted">Sign in to continue shopping.</p>{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{{ field.errors }}</label>{% endfor %}<input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary btn-full">Login</button><p class="auth-switch">New here? <a href="{% url 'register' %}">Create an account</a></p></form></div>{% endblock %}
